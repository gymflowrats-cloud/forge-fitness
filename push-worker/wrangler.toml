name = "forge-push"
main = "worker.js"
compatibility_date = "2024-11-01"

# Every 5 minutes: send reminders whose meal time falls in that 5-minute slot.
[triggers]
crons = ["*/5 * * * *"]

[vars]
# Where notifications open, also used as the VAPID contact.
APP_URL = "https://gymflowrats-cloud.github.io/forge-fitness/"
# Only the app may subscribe phones (comma-separate several, e.g. add http://localhost:5173 for testing).
ALLOWED_ORIGIN = "https://gymflowrats-cloud.github.io,http://localhost:5173"

# Filled in by `npm run push:setup` (scripts/setup-push.mjs).
[[kv_namespaces]]
binding = "SUBS"
id = "c90a91b86df84548a52e36ea3d1d13c4"
